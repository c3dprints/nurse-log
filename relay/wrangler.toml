# Cloudflare Worker for the Nurse's Log mail relay (see README.md in this folder).
# Deploy: npx wrangler deploy   (from this folder)
name = "nurse-log-mail"
main = "worker.mjs"
compatibility_date = "2025-06-01"

[vars]
FROM = "Nurse's Log <hi@c3dprints.com>"
FEEDBACK_TO = "hi@c3dprints.com"

# At most 5 emails a minute per sender IP, and 5 reset codes a minute per recipient.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
